name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: npm run desktop:build
      - run: npx tsx scripts/create-install-fixture.mts install-fixture.json
      - name: Installer, reopen, legacy migration and reinstall smoke
        shell: pwsh
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          ./scripts/windows-install-smoke.ps1 -Installer $installer -Fixture install-fixture.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installers-and-smoke
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            ${{ runner.temp }}/draftsim-install-smoke/result.json
