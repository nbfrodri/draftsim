name: Project checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  interface:
    name: Interface and simulation checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run test:release
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interface-test-results
          path: test-results/
          retention-days: 7
  desktop:
    name: Windows installers and native checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check:version
      # Tauri's beforeBuildCommand builds the frontend exactly once.
      - run: npm run desktop:build -- --ci
      - run: npm run test:desktop
      - run: npx tsx scripts/create-install-fixture.mts install-fixture.json
      - name: Installer, reopen, legacy migration and reinstall smoke
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)
          if ($installers.Count -ne 1 -or $msi.Count -ne 1) { throw 'Expected one NSIS installer and one MSI installer.' }
          ./scripts/windows-install-smoke.ps1 -Installer $installers[0].FullName -Fixture install-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-install-smoke
          path: |
            ${{ runner.temp }}/draftsim-install-smoke/*.json
            ${{ runner.temp }}/draftsim-install-smoke/*.png
            ${{ runner.temp }}/draftsim-install-smoke/*.txt
          retention-days: 7
